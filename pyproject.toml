[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyVideoKit-Libs"
version = "0.4.2"
description = "FFmpeg-based video processing library: trim, concatenate, fade, VHS effect, WAV extraction, lossless FFV1 masters and 4K ProRes exports for YouTube"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Evilchuck666", email = "carlos.martinez.medina1992@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = []
keywords = ["ffmpeg", "video", "video-processing", "ffv1", "prores", "vhs", "youtube", "sox"]

[project.urls]
Homepage = "https://github.com/Evilchuck666/PyVideoKit-Libs"
Source = "https://github.com/Evilchuck666/PyVideoKit-Libs"
Issues = "https://github.com/Evilchuck666/PyVideoKit-Libs/issues"
Releases = "https://github.com/Evilchuck666/PyVideoKit-Libs/releases"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pyvideokit_libs"]
