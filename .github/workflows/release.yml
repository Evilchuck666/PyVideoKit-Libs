name: Build and release

# Builds the sdist and wheel, checks them with twine, installs the wheel on
# every supported Python and runs scripts/smoke_test.py against real FFmpeg,
# FFprobe and SoX. "Run workflow" with a version (e.g. 0.4.0, matching
# pyproject.toml) also publishes a GitHub release with both packages, uploads
# them to PyPI (Trusted Publishing, environment "pypi") and bumps the
# pyvideokit split package on the AUR (needs the AUR_SSH_PRIVATE_KEY secret);
# leave it empty to only build.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.4.0). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: PyVideoKit-Libs-dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test (Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The runner's Azure mirror sometimes crawls, so cap each attempt and
      # fall back to the main Ubuntu archive before retrying.
      - name: Install FFmpeg and SoX
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update \
              && timeout 240 sudo apt-get install --no-install-recommends -y \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg sox; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, switching to archive.ubuntu.com"
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          done
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-Libs-dist
          path: dist

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      # Run from a scratch directory so Python imports the installed wheel,
      # not the src tree.
      - name: Run smoke test
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/scripts/smoke_test.py"

  release:
    name: Publish release
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pyvideokit-libs-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and check tag
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 0.4.0, without the v."
            exit 1
          fi

          code_version=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml)
          if [[ "$code_version" != "$VERSION" ]]; then
            echo "::error::pyproject.toml says $code_version. Bump it to $VERSION first."
            exit 1
          fi

          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-Libs-dist
          path: release-assets

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          packages="pyvideokit_libs-$VERSION.tar.gz pyvideokit_libs-$VERSION-py3-none-any.whl"
          for file in $packages; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Package $file is missing or empty."
              exit 1
            fi
          done
          sha256sum $packages > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release create "v$VERSION" $PACKAGES SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "PyVideoKit-Libs v$VERSION" \
            --generate-notes \
            --latest

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/PyVideoKit-Libs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-Libs-dist
          path: dist

      # No API token: PyPI trusts this workflow file and environment directly.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      VERSION: ${{ inputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR key
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the AUR_SSH_PRIVATE_KEY secret to update the AUR package."
            exit 1
          fi

      - name: Set up SSH and git
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned AUR host keys, see https://aur.archlinux.org
          cat > ~/.ssh/known_hosts << 'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          git config --global user.name "Evilchuck666"
          git config --global user.email "carlos.martinez.medina1992@gmail.com"

      # The AUR base "pyvideokit" builds Libs, CLI and GUI from git, so only
      # pkgver and .SRCINFO change here. makepkg refuses to run as root.
      - name: Bump pkgver and push
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/pyvideokit.git aur
          useradd -m builder
          chown -R builder aur
          cd aur
          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already at $VERSION."
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin master
