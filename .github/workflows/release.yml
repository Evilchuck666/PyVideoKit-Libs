name: Build and release

# Builds the sdist and wheel, checks them with twine, installs the wheel on
# every supported Python and runs scripts/smoke_test.py against real FFmpeg,
# FFprobe and SoX. "Run workflow" with a version (e.g. 0.4.0, matching
# pyproject.toml) also publishes a GitHub release with both packages; leave it
# empty to only build.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.4.0). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: PyVideoKit-Libs-dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test (Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install FFmpeg and SoX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg sox

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-Libs-dist
          path: dist

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      # Run from a scratch directory so Python imports the installed wheel,
      # not the src tree.
      - name: Run smoke test
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/scripts/smoke_test.py"

  release:
    name: Publish release
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pyvideokit-libs-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and check tag
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 0.4.0, without the v."
            exit 1
          fi

          code_version=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml)
          if [[ "$code_version" != "$VERSION" ]]; then
            echo "::error::pyproject.toml says $code_version. Bump it to $VERSION first."
            exit 1
          fi

          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-Libs-dist
          path: release-assets

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          packages="pyvideokit_libs-$VERSION.tar.gz pyvideokit_libs-$VERSION-py3-none-any.whl"
          for file in $packages; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Package $file is missing or empty."
              exit 1
            fi
          done
          sha256sum $packages > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release create "v$VERSION" $PACKAGES SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "PyVideoKit-Libs v$VERSION" \
            --generate-notes \
            --latest
